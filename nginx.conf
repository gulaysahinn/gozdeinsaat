# ==============================================================================
# Gözde İnşaat - Nginx Sunucu Bloğu Yapılandırma Örneği (nginx.conf)
# ==============================================================================

server {
    listen 80;
    server_name gozdeinsaat.com www.gozdeinsaat.com;
    return 301 https://www.gozdeinsaat.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gozdeinsaat.com;

    # SSL Sertifikaları
    # ssl_certificate /etc/letsencrypt/live/gozdeinsaat.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gozdeinsaat.com/privkey.pem;

    return 301 https://www.gozdeinsaat.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.gozdeinsaat.com;

    root /var/www/gozdeinsaat/dist;
    index index.html;

    # SSL Sertifikaları
    # ssl_certificate /etc/letsencrypt/live/gozdeinsaat.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gozdeinsaat.com/privkey.pem;

    # 1. Eski WordPress 301 Kalıcı Yönlendirmeleri
    location = /hizmetlerimiz { return 301 /hizmetler; }
    location = /hizmetlerimiz/ { return 301 /hizmetler; }
    location = /referanslarimiz { return 301 /referanslar; }
    location = /referanslarimiz/ { return 301 /referanslar; }
    location = /galeri { return 301 /projeler; }
    location = /galeri/ { return 301 /projeler; }
    location = /gizlilik-politikamiz { return 301 /gizlilik-politikasi; }
    location = /gizlilik-politikamiz/ { return 301 /gizlilik-politikasi; }
    location = /index.php { return 301 /; }

    # Eski Blog / Hizmet Yazıları
    location = /spor-sahalari/tenis-kortu-yapimi-ve-ozellikleri/ { return 301 /hizmetler/tenis-kortu-yapimi; }
    location = /spor-sahalari/tenis-kortu-saha-ve-zemin-cesitleri/ { return 301 /hizmetler/tenis-kortu-yapimi; }
    location = /spor-sahalari/akrilik-zemin-tenis-kortu-yapimi/ { return 301 /hizmetler/tenis-kortu-yapimi; }
    location = /spor-sahalari/sentetik-cim-tenis-kortu-yapimi/ { return 301 /hizmetler/sentetik-cim-tenis-kortu-yapimi; }
    location = /spor-sahalari/tartan-zemin-tenis-kortu-yapimi/ { return 301 /hizmetler/tartan-zemin-tenis-kortu-yapimi; }
    location = /spor-sahalari/basketbol-sahasi-yapimi-ve-zemin-cesitleri/ { return 301 /hizmetler/basketbol-sahasi-yapimi; }
    location = /spor-sahalari/hali-saha-yapimi-ve-zemin-cesitleri/ { return 301 /hizmetler/hali-saha-yapimi; }
    location = /spor-sahalari/cok-amacli-saha-yapimi-ve-zemin-cesitleri/ { return 301 /hizmetler/cok-amacli-saha-yapimi; }

    # 2. Statik Dosyalar & Önbellek
    location ~* \.(jpg|jpeg|png|webp|avif|ico|svg|css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 3. SPA Fallback - Sayfa yenilemede 404 önleme
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip Sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}
